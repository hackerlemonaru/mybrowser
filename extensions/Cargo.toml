[package]
name = "extensions"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
flate2 = "1.0"
zip = "0.6"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
once_cell = "1"

[dependencies.profile-manager]
path = "../profile-manager"

[dependencies.storage]
path = "../storage"

[lib]
path = "src/lib.rs"

[[bin]]
name = "extension-host"
path = "src/bin/host.rs"
