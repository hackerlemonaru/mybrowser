[package]
name = "browser"
version = "0.1.0"
edition = "2021"

[dependencies]
profile-manager = { path = "../profile-manager" }
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
